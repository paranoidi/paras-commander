name = "default"

# Values may be hex "#RRGGBB", integers 0–255 (ANSI/xterm index), or "default" for the
# emulator’s configured default foreground/background (separate from ANSI black/white).
[palette]
black = 0
red = 1
green = 2
yellow = 3
blue = 4
magenta = 5
cyan = 6
white = 7
bright_black = 8
bright_red = 9
bright_green = 10
bright_yellow = 11
bright_blue = 12
bright_magenta = 13
bright_cyan = 14
bright_white = 15

[menu]                       # misc menu chrome
detail = { fg = "white" }
status = { fg = "cyan" }     # status_command text at top-left of menu bar
spinner = { fg = "bright_magenta", bold = true }
# dropdown is both a leaf style and a parent of .accent/.frame/.selected — keep dotted here
dropdown = { fg = "black", bg = "blue" }
dropdown.accent = { fg = "white"}
dropdown.frame = { fg = "bright_blue", bg = "blue" }
dropdown.selected = { fg = "black", bg = "bright_blue", bold = true }

[menu.bar]                   # top menu bar
active = { fg = "default" }
inactive = { fg = "bright_black" }
accent = { fg = "magenta", bold = true }
alert = { fg = "bright_red", bold = true }
selected = { fg = "black", bg = "cyan", bold = true }

[menu.job]                   # menu-bar job status groups
completed = { fg = "green" }
decision = { fg = "cyan" }
failed = { fg = "red" }
paused = { fg = "yellow" }
queued = { fg = "bright_blue" }
running = { fg = "white" }
scanning = { fg = "magenta" }

[menu.progress]              # menu-bar aggregate progress
done = { fg = "green" }
remaining = { fg = "bright_black" }

[message]
info = { fg = "black", bg = "white" }
warn = { fg = "black", bg = "yellow", bold = true }
error = { fg = "bright_white", bg = "red", bold = true }

[footer]
key = { fg = "magenta", bold = true }
label = { fg = "default" }
label.shift = { fg = "bright_black" }

[panel]                      # panel-wide text
text = { fg = "white" }
hint = { fg = "bright_white", bold = true }

[panel.row]                  # file-list row colors
directory = { fg = "blue", bold = true }
file = { fg = "white" }
info = { fg = "bright_black" }  # size / mtime / permissions / meta columns
selected = { fg = "yellow", bold = true }
symlink = { fg = "bright_cyan" }
tree.connector = { fg = "bright_black" }

[panel.row.mark]             # suffix marks on file rows
selection_subtree = { fg = "yellow" }
new = { fg = "bright_green" }
new.previous = { fg = "bright_yellow" }
renamed = { fg = "cyan" }
no_permission = { fg = "bright_black" }
job = { fg = "green" }
job.read = { fg = "yellow" }
job.decision = { fg = "red" }

[panel.icon.folder]          # folder icon colors
open = { fg = "bright_cyan" }
mount = { fg = "bright_blue" }
scanning = { fg = "bright_magenta" }
excluded = { fg = "black" }

[panel.icon.preview]          # prefetch-cache debug tint for image/video file icons
warm = { fg = "yellow" }            # cache warm (preloaded)
cold = { fg = "magenta" }          # not yet preloaded

[panel.status]                # bottom-border status segments
sync = { fg = "green", bold = true }
quick_view = { fg = "green", bold = true }
selections = { fg = "white" }
selection_size = { fg = "yellow" }
dotfiles_hidden = { fg = "bright_black" }
gitignore = { fg = "bright_black" }
stash = { fg = "yellow", bold = true }
entry_filter = { fg = "yellow", bold = true }
other_panel = { fg = "cyan", bold = true }
image_sixel = { fg = "bright_black" }
image_sixel_tmux = { fg = "bright_red", bold = true }

[panel.git]                   # git status colors
conflicted = { fg = "red" }
deleted = { fg = "red" }
ignored = { fg = "bright_black" }
modified = { fg = "blue" }
new = { fg = "green" }
not_modified = { fg = "bright_black", bold = true }
renamed = { fg = "yellow" }
typechange = { fg = "magenta" }

[panel.scrollbar]             # scrollbar track/thumb colors
track = { fg = "bright_black" }
thumb = { fg = "white" }

[panel.usage]                 # disk usage bar colors
normal = { fg = "white", bg = "bright_black" }
selected = { fg = "yellow", bg = "bright_black" }

[terminal]
text = { fg = "white" }

[panel.dedup]
row.all_marked = { fg = "red", bold = true }
row.cursor.all_marked = { fg = "red", bg = "cyan", bold = true }
row.keep = { fg = "bright_green", bold = true }
row.cursor.keep = { fg = "bright_green", bg = "cyan", bold = true }
row.mark.keep_subtree = { fg = "bright_green" }

[panel.active]
disk_usage_overview = { fg = "blue"}
frame = { fg = "blue" }
header = { fg = "bright_white", bg = "blue", bold = true }
header.carousel = { fg = "white", bg = "bright_black" }
row.cursor = { fg = "black", bg = "cyan", icon = "black" }
row.cursor.selected = { fg = "yellow", bg = "cyan", bold = true, icon = "black" }
row.cursor.unique = { fg = "black", bg = "green", icon = "black" }
surface = { fg = "white" }
title = { fg = "white", bold = true }
usage.cursor = { fg = "black", bg = "bright_cyan" }
usage.cursor.selected = { fg = "yellow", bg = "bright_blue", bold = true }

[panel.target]
frame = { fg = "green" }

[panel.vimotion]
frame = { fg = "yellow" }

[panel.carousel.inactive]
row.cursor = { bg = "black" }
row.cursor.selected = { fg = "yellow", bg = "black", bold = true }

[panel.inactive]
disk_usage_overview = { fg = "bright_black"}
frame = { fg = "bright_black" }
header = { fg = "bright_white", bg = "blue", bold = true }
header.carousel = { fg = "black", bg = "bright_black" }
row.cursor = { bg = "black" }
row.cursor.selected = { fg = "yellow", bg = "cyan", bold = true }
surface = { fg = "white" }
title = { fg = "white" }
usage.cursor = { fg = "white", bg = "black" }
usage.cursor.selected = { fg = "yellow", bg = "bright_blue", bold = true }

[panel.blocked]
disk_usage_overview = { fg = "bright_black" }
frame = { fg = "bright_black" }
header = { fg = "bright_black", bold = true }
header.carousel = { fg = "bright_black", bg = "default", bold = true }
row.cursor = { fg = "white", bg = "black" }
row.cursor.selected = { fg = "white" }
row.directory = { fg = "bright_black", bold = true }
row.file = { fg = "bright_black" }
row.selected = { fg = "white" }
row.symlink = { fg = "cyan" }
surface = { fg = "bright_black" }
text = { fg = "bright_black" }
title = { fg = "bright_black" }

[fuzzy]
highlight = { fg = "magenta", bold = true }
highlight.cursor = { fg = "red", bold = true }
input = { fg = "bright_yellow", bold = true }
input.nomatch = { fg = "bright_red", bold = true }

[dialog]                     # dialog chrome
frame = { fg = "white" }
surface = { fg = "white", bg = "bright_black" }
text = { fg = "white" }
title = { bold = true }
# bg matters for the path-picker trailing glyph when that control is focused; shortcut letters use fg+bold only.
accent = { fg = "white", bg = "black", bold = true }

[dialog.button]
active = { fg = "black", bg = "cyan" }
active_destructive = { fg = "white", bg = "red" }
inactive = { fg = "white", bg = "black" }

[dialog.input]
active = { fg = "bright_white", bold = true }
active.error = { fg = "red" }
active.placeholder = { fg = "default" }
inactive = { fg = "white", bg = "black" }
inactive.error = { fg = "red", bg = "black" }
inactive.placeholder = { fg = "white", bg = "black" }

[dialog.option]
active = { fg = "yellow", bold = true }
active.selected = { fg = "bright_white", bold = true }
inactive = { fg = "white" }
selected = { fg = "yellow" }
invalid = { fg = "red" }

[dialog.status]              # dialog status segments (e.g. find selection size)
selection_size = { fg = "yellow" }

[dialog.progress]
fill = { fg = "white", bg = "black" }
label.on_fill = { fg = "bright_white", bold = true }
label.on_track = { fg = "bright_white", bold = true }
track = { fg = "white", bg = "bright_black" }

[leader_menu]                 # Esc function menu letters
surface = { bg = "black" }
	group = { fg = "cyan", bold = true }
	key     = { fg = "magenta", bold = true }
arrow   = { fg = "bright_black" }
label   = { fg = "white" }

[dialog.massrename]
before = { fg = "white" }
before.removed = { fg = "red", bold = true }
before.replaced = { fg = "yellow", bold = true }
after = { fg = "yellow" }
after.added = { fg = "green", bold = true }
after.error = { fg = "bright_red", bold = true }

[jobs]                       # status-column bucket styles
done = { fg = "bright_green", bold = true }
failed = { fg = "bright_red", bold = true }
row = { fg = "white" }
running = { fg = "bright_cyan", bold = true }

[jobs.progress]
fill = { fg = "black", bg = "bright_green" }
label.on_fill = { fg = "black", bold = true }
label.on_track = { fg = "bright_white", bold = true }
track = { fg = "bright_black", bg = "black" }

[jobs.icons]                 # leading icon column (1:1 with job status strings)
completed = { fg = "bright_green", bold = true }
failed = { fg = "bright_red", bold = true }
decision = { fg = "cyan", bold = true }
running = { fg = "bright_green", bold = true }
paused = { fg = "yellow", bold = true }
queued = { fg = "yellow", bold = true }
scanning = { fg = "bright_cyan", bold = true }
canceled = { fg = "bright_red", bold = true }

[symbols]
working = "\uf017"
path_picker = "\uf0ca"
file = "\uf15b"
folder = "\uf07b"
git = "\uf1d3"
stash = "\uef0d"
# U+F06D1 (nf-md-eye_off_outline); use 8-digit escape — \uf06d1 is U+F06D + "1"
hidden_dotfiles = "\U000F06D1"

[symbols.jobs.list]
scanning = "\uf110"
queued = "\u23F3"
running = "\uf144"
paused = "\uf28b"
canceled = "\uf52f"
failed = "\uf06a"
decision = "\uf059"
completed = "\uf05d"

[symbols.filelist]
selection_subtree = ""
new = "\uea7f"
renamed = "\U000f11e8"
no_permission = "\uf023"
job = "\U000f02ca"
preview_loading = "\uf03e"

[symbols.folders]
folder = "\U000F024B"
open = "\U000F0770"
scanning = "\U000F0D0B"
mount = "\U000F0256"
excluded = "\uf114"

[symbols.scrollbar]
thumb = "┃"

[symbols.tree]
continue = "│"
branch = "├─"
end = "└─"
leaf = "·"

[symbols.meta]
running = "\uf141"

[symbols.menu.progress]
done = "─"
remaining = "-"

[symbols.menu.job]
scanning = "\U000f02ca"
completed = ""
failed = ""
decision = ""
paused = ""
running = ""
queued = ""

[symbols.selections]
multi_location = "\uef81"

[symbols.leader_menu]
arrow = "\uea9c"

[symbols.compare]
equal = "="
relocated = "\u2194"
primary_only = "<"
secondary_only = ">"
content_diff = "\u2260"
pending = "?"
error = "!"
