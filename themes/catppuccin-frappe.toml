name = "catppuccin-frappe"
# Generated by import_alacritty.py. Everything not listed here (styles, icons) is inherited from
# the built-in default theme.

[palette]
black = "#51576d"
red = "#e78284"
green = "#a6d189"
yellow = "#e5c890"
blue = "#8caaee"
magenta = "#f4b8e4"
cyan = "#81c8be"
white = "#b5bfe2"
bright_black = "#626880"
bright_red = "#e78284"
bright_green = "#a6d189"
bright_yellow = "#e5c890"
bright_blue = "#8caaee"
bright_magenta = "#f4b8e4"
bright_cyan = "#81c8be"
bright_white = "#a5adce"

[roles]
bg = "#303446"
surface = "#414559"
header_bg = "#8caaee"
menu_bg = "#232634"
focus_bg = "#51576d"
file_cursor_bg = "#949cbb"
file_cursor_dim = "#414559"
highlight_bg = "#babbf1"
range_bg = "#737994"
range_unselect_bg = "#ea999c"
inverse_bg = "white"
fg = "#c6d0f5"
fg_strong = "#c6d0f5"
muted = "#949cbb"
faint = "#737994"
info_columns = "#626880"
ink = "#232634"
focus_fg = "#c6d0f5"
file_cursor_fg = "#232634"
accent = "#ca9ee6"
primary = "blue"
inactive_frame = "#626880"
directory = "blue"
symlink = "bright_cyan"
selected = "yellow"
info = "cyan"
success = "green"
success_strong = "bright_green"
warning = "yellow"
attention = "bright_yellow"
danger = "red"
error = "bright_red"
special = "magenta"

[menu]
dropdown = { fg = "fg", bg = "menu_bg" }
dropdown.accent = { fg = "accent"}

[message]
error = { fg = "ink", bg = "danger", bold = true }

[panel.row]
info = { fg = "info_columns" }  # keep the dark columns: repair would brighten them  # tuned

[panel.dedup]
row.cursor.all_marked = { fg = "ink", bg = "file_cursor_bg", bold = true }
row.cursor.keep = { fg = "ink", bg = "file_cursor_bg", bold = true }

[panel.active]
header = { fg = "ink", bg = "header_bg", bold = true }
row.cursor.selected = { fg = "ink", bg = "file_cursor_bg", bold = true, icon = "file_cursor_fg" }
usage.cursor = { fg = "ink", bg = "highlight_bg" }  # tuned
usage.cursor.selected = { fg = "ink", bg = "highlight_bg", bold = true }

[panel.inactive]
frame = { fg = "inactive_frame" }  # keep the dim frame: repair would brighten it  # tuned
header = { fg = "ink", bg = "header_bg", bold = true }
usage.cursor.selected = { fg = "ink", bg = "highlight_bg", bold = true }

[panel.blocked]
disk_usage_overview = { fg = "faint" }  # tuned
frame = { fg = "faint" }  # tuned
header = { fg = "faint", bold = true }  # tuned
header.carousel = { fg = "faint", bg = "bg", bold = true }  # tuned
row.directory = { fg = "faint", bold = true }  # tuned
row.file = { fg = "faint" }  # tuned
row.symlink = { fg = "faint" }  # tuned
surface = { fg = "faint" }  # tuned
text = { fg = "faint" }  # tuned
title = { fg = "faint" }  # tuned

[dialog.button]
active_destructive = { fg = "ink", bg = "danger" }

[dialog.option]
invalid = { fg = "fg" }

[tooltip]
info = { fg = "ink" }       # foreground of the info icon ([icons.dialog] info) on the box

[dialog.massrename]
before.removed = { fg = "fg", bold = true }
