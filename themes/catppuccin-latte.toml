name = "catppuccin-latte"
# Generated by import_alacritty.py. Everything not listed here (styles, icons) is inherited from
# the built-in default theme.

[palette]
black = "#bcc0cc"
red = "#d20f39"
green = "#40a02b"
yellow = "#df8e1d"
blue = "#1e66f5"
magenta = "#ea76cb"
cyan = "#179299"
white = "#5c5f77"
bright_black = "#acb0be"
bright_red = "#d20f39"
bright_green = "#40a02b"
bright_yellow = "#df8e1d"
bright_blue = "#1e66f5"
bright_magenta = "#ea76cb"
bright_cyan = "#179299"
bright_white = "#6c6f85"

[roles]
bg = "#eff1f5"
surface = "#bcc0cc"
header_bg = "#1e66f5"
inactive_header_bg = "#acb0be"
menu_bg = "#dce0e8"
leader_bg = "#dce0e8"
focus_bg = "#acb0be"
button_bg = "#eff1f5"
button_focus_bg = "#acb0be"
file_cursor_bg = "#c9cdd8"
file_cursor_dim = "#dce0e8"
highlight_bg = "#1e66f5"
range_bg = "#9ca0b0"
range_unselect_bg = "#e64553"
inverse_bg = "white"
fg = "#4c4f69"
fg_strong = "#000000"
muted = "#5c5f77"
faint = "#9ca0b0"
info_columns = "#5c5f77"
ink = "#eff1f5"
focus_fg = "#4c4f69"
file_cursor_fg = "#000000"
accent = "#8839ef"
accent_alt = "#dc8a78"
primary = "blue"
inactive_frame = "#acb0be"
directory = "blue"
symlink = "bright_cyan"
selected = "#a85600"
info = "cyan"
success = "green"
success_strong = "bright_green"
warning = "yellow"
attention = "bright_yellow"
danger = "red"
error = "bright_red"
special = "magenta"

[status]
scanning = { fg = "fg", bold = true }   # also disk usage, fileindex scans, spinners
queued = { fg = "fg", bold = true }
running = { fg = "fg", bold = true }
paused = { fg = "fg", bold = true }
decision = { fg = "fg", bold = true }
canceling = { fg = "fg", bold = true }
completed = { fg = "fg", bold = true }

[menu]
status = { fg = "fg" }     # status-command text at top-left of menu bar (status.toml)
dropdown = { fg = "fg", bg = "menu_bg" }
dropdown.accent = { fg = "accent"}
dropdown.selected = { fg = "fg_strong", bg = "focus_bg", bold = true }

[menu.bar]
selected = { fg = "fg_strong", bg = "focus_bg", bold = true }

[menu.progress]
done = { fg = "fg" }
delete.gfx.2 = { fg = "fg" }
delete.gfx.3 = { fg = "fg" }
remove.gfx.1 = { fg = "fg" }

[message]
warn = { fg = "fg", bg = "warning", bold = true }  # text reads better than base on yellow  # tuned
error = { fg = "ink", bg = "danger", bold = true }
success = { fg = "fg_strong", bg = "success" }

[footer]
hover = { fg = "fg_strong", bg = "focus_bg" }  # entry under the mouse pointer

[panel.row]
cursor.range = { fg = "bg", bg = "selected", icon = "bg" }  # light text on the amber range row  # tuned
cursor.range.selected = { fg = "bg", bg = "selected", bold = true, icon = "bg" }  # tuned
selected = { fg = "selected", bold = true }  # marked files: the same amber on every row  # tuned
symlink = { fg = "fg" }

[panel.row.mark]
new.previous = { fg = "fg" }
pinned = { fg = "fg" }
job.read = { fg = "fg" }

[panel.icon.preview]
warm = { fg = "fg" }            # cache warm (preloaded)
cold = { fg = "fg" }          # not yet preloaded

[panel.status]
sync = { fg = "fg", bold = true }
quick_view = { fg = "fg", bold = true }
find_parked = { fg = "fg", bold = true }   # find dialog parked from this panel
entry_filter = { fg = "fg", bold = true }
other_panel = { fg = "fg", bold = true }

[panel.git]
new = { fg = "fg" }
renamed = { fg = "fg" }
typechange = { fg = "fg" }

[panel.fileindex]
unhashed = { fg = "fg" }       # indexed, hash pending
changed = { fg = "fg" }
differs = { fg = "fg", bold = true }
unchecked = { fg = "fg" }

[panel.meta]
warn = { fg = "fg" }

[panel.usage]
selected = { fg = "fg_strong", bg = "surface", icon.file = "faint", icon.folder_open = "faint", icon.folder_mount = "faint", icon.folder_excluded = "faint", icon.fileindex = "faint", icon.git = "faint", icon.suffix = "faint" }

[panel.dedup]
row.cursor.all_marked = { fg = "fg", bg = "file_cursor_bg", bold = true }
row.keep = { fg = "fg", bold = true }
row.cursor.keep = { fg = "fg", bg = "file_cursor_bg", bold = true }
full_dir = { fg = "fg" }
full_dir_content = { fg = "fg" }
potential = { fg = "fg" }

[panel.active]
row.cursor.selected = { fg = "selected", bg = "file_cursor_bg", bold = true, icon = "file_cursor_fg" }  # marked files: the same amber on the cursor row  # tuned
row.cursor.unique = { fg = "fg_strong", bg = "success", icon = "ink" }
title = { fg = "special", bold = true }  # pink (magenta): the active panel title (path, Queue, Details, Operations) stands out  # tuned
usage.cursor = { fg = "ink", bg = "highlight_bg" }  # tuned
usage.cursor.selected = { fg = "ink", bg = "highlight_bg", bold = true }

[panel.target]
title = { fg = "fg", bold = true }

[panel.target.warning]
frame = { fg = "fg" }
title = { fg = "fg", bold = true }

[panel.vimotion]
frame = { fg = "fg" }

[panel.carousel.inactive]
row.cursor.selected = { fg = "selected", bg = "file_cursor_dim", bold = true }  # tuned

[panel.inactive]
frame = { fg = "inactive_frame" }  # keep the dim frame: repair would brighten it  # tuned
row.cursor.selected = { fg = "selected", bg = "file_cursor_dim", bold = true }  # tuned
usage.cursor.selected = { fg = "ink", bg = "highlight_bg", bold = true }

[panel.blocked]
disk_usage_overview = { fg = "faint" }  # tuned
frame = { fg = "faint" }  # tuned
header = { fg = "faint", bold = true }  # tuned
header.carousel = { fg = "faint", bg = "bg", bold = true }  # tuned
row.directory = { fg = "faint", bold = true }  # tuned
row.file = { fg = "faint" }  # tuned
row.symlink = { fg = "faint" }  # tuned
surface = { fg = "faint" }  # tuned
text = { fg = "faint" }  # tuned
title = { fg = "faint" }  # tuned

[fuzzy]
input = { fg = "fg", bold = true }

[dialog]
accent_alt = { fg = "fg_strong", bold = true }

[dialog.button]
active = { fg = "fg_strong", bg = "button_focus_bg" }
active.accent = { fg = "fg_strong", bold = true }
active.accent_alt = { fg = "fg_strong", bold = true }
active_destructive = { fg = "ink", bg = "danger" }
active_destructive.accent = { fg = "ink", bold = true }
active_destructive.accent_alt = { fg = "accent_alt", bold = true }  # tuned

[dialog.option]
active = { fg = "fg_strong", bold = true }
selected = { fg = "fg_strong" }
invalid = { fg = "fg_strong" }

[dialog.status]
selection_size = { fg = "fg_strong" }

[leader_menu]
group = { fg = "fg", bold = true }

[dialog.help]
section = { fg = "fg_strong", bold = true }
key     = { fg = "fg_strong", bold = true }

[dialog.completion]
item.selected = { fg = "fg_strong", bg = "focus_bg", bold = true }
match.selected = { fg = "fg_strong", bg = "focus_bg", bold = true, underline = true }

[tooltip]
info = { fg = "ink" }       # foreground of the info icon ([icons.dialog] info) on the box

[dialog.massrename]
before.removed = { fg = "fg_strong", bold = true }
before.replaced = { fg = "fg_strong", bold = true }
after = { fg = "fg_strong" }
after.added = { fg = "fg_strong", bold = true }

[jobs.progress]
fill = { fg = "fg_strong", bg = "success" }
label.on_fill = { fg = "fg_strong", bold = true }

[jobs.progress.completed]
fill = { fg = "fg_strong", bg = "surface" }

[jobs.detail]
plot = { fg = "fg" }

[jobs.operations]
success = { fg = "fg", bold = true }
skipped = { fg = "fg", bold = true }

[compare]
hashing = { fg = "fg", bold = true }
equal = { fg = "fg" }
