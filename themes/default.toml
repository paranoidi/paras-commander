[panel.icon.folder]          # folder icon colors
open = { fg = "symlink" }
mount = { fg = "highlight_bg" }
excluded = { fg = "faint" }

[panel.icon.preview]          # prefetch-cache debug tint for image/video file icons
warm = { fg = "warning" }            # cache warm (preloaded)
cold = { fg = "special" }          # not yet preloaded

[panel.status]                # bottom-border status segments
sync = { fg = "success", bold = true }
quick_view = { fg = "success", bold = true }
selected = { fg = "fg" }
selection_size = { fg = "selected" }
dotfiles_hidden = { fg = "muted" }
gitignore = { fg = "muted" }
stash = { fg = "selected", bold = true }
find_parked = { fg = "attention", bold = true }   # find dialog parked from this panel
entry_filter = { fg = "attention", bold = true }
other_panel = { fg = "info", bold = true }
image_sixel = { fg = "muted" }
image_sixel_tmux = { fg = "error", bold = true }

[panel.git]                   # git status colors
conflicted = { fg = "danger" }
deleted = { fg = "danger" }
ignored = { fg = "muted" }
modified = { fg = "primary" }
new = { fg = "success" }
not_modified = { fg = "muted", bold = true }
renamed = { fg = "warning" }
typechange = { fg = "special" }

[panel.fileindex]             # "browse with fileindex" state icon colors (replace git status)
indexed = { fg = "muted" }
unhashed = { fg = "info" }       # indexed, hash pending
changed = { fg = "warning" }
new = { fg = "danger" }
missing = { fg = "error" }
excluded = { fg = "muted" }
