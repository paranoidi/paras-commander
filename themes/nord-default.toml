name = "nord-default"
# Generated by import_alacritty.py. Everything not listed here (styles, icons) is inherited from
# the built-in default theme.

[palette]
black = "#3b4252"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#88c0d0"
white = "#e5e9f0"
bright_black = "#4c566a"
bright_red = "#bf616a"
bright_green = "#a3be8c"
bright_yellow = "#ebcb8b"
bright_blue = "#81a1c1"
bright_magenta = "#b48ead"
bright_cyan = "#8fbcbb"
bright_white = "#eceff4"

[roles]
bg = "#2e3440"
surface = "#3f4758"
header_bg = "#4c566a"
menu_bg = "#3b4252"
focus_bg = "#4c566a"
button_bg = "#2e3440"
button_focus_bg = "#4c566a"
file_cursor_bg = "#3f4758"
file_cursor_dim = "#434c5e"
highlight_bg = "bright_blue"
range_bg = "#434c5e"
range_unselect_bg = "#3b4252"
inverse_bg = "white"
fg = "#d8dee9"
fg_strong = "bright_white"
muted = "#81a1c1"
faint = "#4c566a"
info_columns = "#d8dee9"
ink = "#2e3440"
focus_fg = "#d8dee9"
file_cursor_fg = "#d8dee9"
accent = "#ebcb8b"
accent_alt = "#ebcb8b"
primary = "blue"
inactive_frame = "#4c566a"
directory = "blue"
symlink = "bright_cyan"
selected = "yellow"
info = "cyan"
success = "green"
success_strong = "bright_green"
warning = "yellow"
attention = "bright_yellow"
danger = "red"
error = "bright_red"
special = "magenta"

[status]
failed = { fg = "fg", bold = true }
canceled = { fg = "fg", bold = true }

[menu]
dropdown = { fg = "fg", bg = "menu_bg" }
dropdown.accent = { fg = "accent"}

[menu.bar]
alert = { fg = "fg", bold = true }

[panel.status]
image_sixel_tmux = { fg = "fg", bold = true }

[panel.git]
conflicted = { fg = "fg" }
deleted = { fg = "fg" }

[panel.fileindex]
new = { fg = "fg" }
missing = { fg = "fg" }

[panel.meta]
critical = { fg = "fg" }

[panel.dedup]
row.all_marked = { fg = "fg", bold = true }
row.cursor.all_marked = { fg = "fg", bg = "file_cursor_bg", bold = true }
full_dir_hidden = { fg = "fg" }

[panel.active]
usage.cursor.selected = { fg = "ink", bg = "highlight_bg", bold = true }

[panel.inactive]
frame = { fg = "inactive_frame" }  # keep the dim frame: repair would brighten it  # tuned
usage.cursor.selected = { fg = "ink", bg = "highlight_bg", bold = true }

[fuzzy]
input.nomatch = { fg = "fg", bold = true }

[dialog.button]
active_destructive = { fg = "fg_strong", bg = "danger" }
active_destructive.accent = { fg = "fg_strong", bold = true }
active_destructive.accent_alt = { fg = "accent_alt", bold = true }  # tuned

[dialog.input]
active.error = { fg = "fg" }
inactive.error = { fg = "fg", bg = "bg" }

[dialog.option]
invalid = { fg = "fg" }

[tooltip]
info = { fg = "ink" }       # foreground of the info icon ([icons.dialog] info) on the box

[dialog.massrename]
before.removed = { fg = "fg", bold = true }

[jobs.operations]
failed = { fg = "fg", bold = true }

[compare]
content_diff = { fg = "fg" }
