site_name: Paras Commander
site_url: https://paranoidi.github.io/paras-commander/
docs_dir: docs
site_dir: site
use_directory_urls: false
exclude_docs: |
  agents/

nav:
  - Overview: index.md
  - getting-started.md
  - Usage:
      - panels.md
      - layout.md
      - selections.md
      - quick-view-preview.md
      - graphics.md
      - navigation.md
      - find-files.md
      - panel-filter.md
      - path-completion.md
      - menus.md
      - shortcuts.md
  - Tools:
      - disk-usage.md
      - compare-directories.md
      - find-duplicates.md
      - mass-rename.md
      - commands.md
      - meta-columns.md
      - archives.md
      - subshell.md
      - messages.md
  - Operations:
      - fileoperations.md
      - jobs.md
      - background-scan-throttle.md
      - elevation.md
      - sftp.md
      - chooser-mode.md
  - Configuration:
      - config.md
      - keybindings.md
      - themes.md
      - predicates.md

theme:
  name: material
  features:
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
