name = "nordic-default"
# Generated by import_alacritty.py. Everything not listed here (styles, icons) is inherited from
# the built-in default theme.

[palette]
black = "#191d24"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#5e81ac"
magenta = "#b48ead"
cyan = "#8fbcbb"
white = "#bbc3d4"
bright_black = "#3b4252"
bright_red = "#c5727a"
bright_green = "#b1c89d"
bright_yellow = "#efd49f"
bright_blue = "#88c0d0"
bright_magenta = "#be9d88"
bright_cyan = "#9fc6c5"
bright_white = "#d8dee9"

[roles]
bg = "#242933"
surface = "#2e3440"
header_bg = "#4c566a"
inactive_header_bg = "#4c566a"
menu_bg = "#1e222a"
focus_bg = "#4c566a"
button_bg = "#242933"
button_focus_bg = "#4c566a"
file_cursor_bg = "#3b4252"
file_cursor_dim = "#2e3440"
highlight_bg = "bright_blue"
range_bg = "#3b4252"
range_unselect_bg = "#2e3440"
inverse_bg = "white"
fg = "#d8dee9"
fg_strong = "bright_white"
muted = "#81a1c1"
faint = "#4c566a"
info_columns = "#bbc3d4"
ink = "#191d24"
focus_fg = "#d8dee9"
file_cursor_fg = "#bbc3d4"
accent = "#ebcb8b"
accent_alt = "#ebcb8b"
primary = "#81a1c1"
inactive_frame = "#4c566a"
directory = "#81a1c1"
symlink = "bright_cyan"
selected = "yellow"
info = "cyan"
success = "green"
success_strong = "bright_green"
warning = "yellow"
attention = "bright_yellow"
danger = "red"
error = "#d08770"
special = "magenta"

[status]
canceled = { fg = "fg", bold = true }

[menu]
dropdown = { fg = "fg", bg = "menu_bg" }
dropdown.accent = { fg = "accent"}

[message]
error = { fg = "ink", bg = "danger", bold = true }

[panel.git]
conflicted = { fg = "fg" }
deleted = { fg = "fg" }

[panel.fileindex]
new = { fg = "fg" }

[panel.meta]
critical = { fg = "fg" }

[panel.dedup]
row.all_marked = { fg = "fg", bold = true }
row.cursor.all_marked = { fg = "fg", bg = "file_cursor_bg", bold = true }
full_dir_hidden = { fg = "fg" }

[panel.active]
usage.cursor.selected = { fg = "ink", bg = "highlight_bg", bold = true }

[panel.inactive]
frame = { fg = "inactive_frame" }  # keep the dim frame: repair would brighten it  # tuned
usage.cursor.selected = { fg = "ink", bg = "highlight_bg", bold = true }

[dialog.button]
active_destructive = { fg = "ink", bg = "danger" }
active_destructive.accent = { fg = "ink", bold = true }
active_destructive.accent_alt = { fg = "ink", bold = true }

[dialog.input]
active.error = { fg = "fg" }
inactive.error = { fg = "fg", bg = "bg" }

[dialog.option]
invalid = { fg = "fg" }

[tooltip]
info = { fg = "ink" }       # foreground of the info icon ([icons.dialog] info) on the box

[dialog.massrename]
before.removed = { fg = "fg", bold = true }
