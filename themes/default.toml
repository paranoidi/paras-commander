name = "default"

# Values may be hex "#RRGGBB", integers 0–255 (ANSI/xterm index), or "default" for the
# emulator’s configured default foreground/background (separate from ANSI black/white).
[palette]
black = 0
red = 1
green = 2
yellow = 3
blue = 4
magenta = 5
cyan = 6
white = 7
bright_black = 8
bright_red = 9
bright_green = 10
bright_yellow = 11
bright_blue = 12
bright_magenta = 13
bright_cyan = 14
bright_white = 15

[menu]
bar = { fg = "default" }
bar.accent = { fg = "magenta", bold = true }
bar.alert = { fg = "bright_red", bold = true }
bar.selected = { fg = "black", bg = "cyan", bold = true }
detail = { fg = "white" }
dropdown = { fg = "black", bg = "blue" }
dropdown.accent = { fg = "white"}
dropdown.frame = { fg = "bright_blue", bg = "blue" }
dropdown.selected = { fg = "black", bg = "bright_blue", bold = true }
job.canceled = { fg = "red" }
job.completed = { fg = "green" }
job.decision = { fg = "bright_blue" }
job.failed = { fg = "bright_red" }
job.paused = { fg = "yellow" }
job.queued = { fg = "yellow" }
job.running = { fg = "green" }
job.scanning = { fg = "bright_cyan" }
progress.done = { fg = "green" }
progress.remaining = { fg = "bright_black" }
spinner = { fg = "bright_magenta", bold = true }

[message]
info = { fg = "black", bg = "white" }
warn = { fg = "black", bg = "yellow", bold = true }
error = { fg = "bright_white", bg = "red", bold = true }

[footer]
key = { fg = "magenta", bold = true }
label = { fg = "default" }
label.shift = { fg = "bright_black" }

[panel]
row.directory = { fg = "blue", bold = true }
row.file = { fg = "white" }
row.selected = { fg = "yellow", bold = true }
row.symlink = { fg = "bright_cyan" }
row.indicator.selection_subtree = { fg = "yellow" }
row.indicator.new = { fg = "bright_green" }
row.indicator.new.previous = { fg = "bright_yellow" }
icon.folder.open = { fg = "bright_cyan" }
icon.folder.mount = { fg = "bright_blue" }
indicator.sync = { fg = "green", bold = true }
indicator.quick_view = { fg = "green", bold = true }
indicator.selections = { fg = "white" }
indicator.selection_size = { fg = "yellow" }
indicator.dotfiles_hidden = { fg = "bright_black" }
indicator.gitignore = { fg = "bright_black" }
indicator.stash = { fg = "yellow", bold = true }
indicator.other_panel = { fg = "cyan", bold = true }
scrollbar.track = { fg = "bright_black" }
scrollbar.thumb = { fg = "white" }
text = { fg = "white" }

git.conflicted = { fg = "red" }
git.deleted = { fg = "red" }
git.ignored = { fg = "bright_black" }
git.modified = { fg = "blue" }
git.new = { fg = "green" }
git.not_modified = { fg = "bright_black", bold = true }
git.renamed = { fg = "yellow" }
git.typechange = { fg = "magenta" }

icon.folder.scanning = { fg = "bright_magenta" }
icon.folder.excluded = { fg = "black" }

usage.normal = { fg = "white", bg = "bright_black" }
usage.selected = { fg = "yellow", bg = "bright_black" }

[panel.active]
disk_usage_overview = { fg = "blue"}
frame = { fg = "blue" }
header = { fg = "bright_white", bg = "blue", bold = true }
header.carousel = { fg = "black", bg = "bright_black" }
row.cursor = { fg = "black", bg = "cyan", icon = "black" }
row.cursor.selected = { fg = "yellow", bg = "cyan", bold = true, icon = "black" }
surface = { fg = "white" }
title = { fg = "white", bold = true }
usage.cursor = { fg = "black", bg = "bright_cyan" }
usage.cursor.selected = { fg = "yellow", bg = "bright_blue", bold = true }

[panel.carousel.inactive]
row.cursor = { fg = "white", bg = "black" }
row.cursor.selected = { fg = "yellow", bg = "black", bold = true }

[panel.inactive]
disk_usage_overview = { fg = "bright_black"}
frame = { fg = "bright_black" }
header = { fg = "bright_white", bg = "blue", bold = true }
header.carousel = { fg = "bright_white", bg = "bright_black", bold = true }
row.cursor = { fg = "white", bg = "black" }
row.cursor.selected = { fg = "yellow", bg = "cyan", bold = true }
surface = { fg = "white" }
title = { fg = "white" }
usage.cursor = { fg = "white", bg = "black" }
usage.cursor.selected = { fg = "yellow", bg = "bright_blue", bold = true }

[panel.blocked]
disk_usage_overview = { fg = "bright_black" }
frame = { fg = "bright_black" }
header = { fg = "bright_black", bold = true }
header.carousel = { fg = "bright_black", bg = "bright_black", bold = true }
row.cursor = { fg = "white", bg = "black" }
row.cursor.selected = { fg = "white" }
row.directory = { fg = "bright_black", bold = true }
row.file = { fg = "bright_black" }
row.selected = { fg = "white" }
row.symlink = { fg = "cyan" }
surface = { fg = "bright_black" }
text = { fg = "bright_black" }
title = { fg = "bright_black" }

[fuzzy]
highlight = { fg = "magenta", bold = true }
highlight.cursor = { fg = "red", bold = true }
input = { fg = "bright_yellow", bold = true }
input.nomatch = { fg = "bright_red", bold = true }

[dialog]
frame = { fg = "white" }
surface = { fg = "white", bg = "bright_black" }
text = { fg = "white" }
title = { bold = true }
# bg matters for the path-picker trailing glyph when that control is focused; shortcut letters use fg+bold only.
accent = { fg = "white", bg = "black", bold = true }
button.active = { fg = "black", bg = "cyan" }
button.active_destructive = { fg = "white", bg = "red" }
button.inactive = { fg = "white", bg = "black" }
input.active = { fg = "bright_white", bold = true }
input.active.error = { fg = "red" }
input.active.placeholder = { fg = "default" }
input.inactive = { fg = "white", bg = "black" }
input.inactive.error = { fg = "red", bg = "black" }
input.inactive.placeholder = { fg = "white", bg = "black" }
option.active = { fg = "yellow", bold = true }
option.active.selected = { fg = "bright_white", bold = true }
option.inactive = { fg = "white" }
option.selected = { fg = "yellow" }
option.invalid = { fg = "red" }
indicator.selection_size = { fg = "yellow" }

[dialog.massrename]
before = { fg = "white" }
before.removed = { fg = "red", bold = true }
before.replaced = { fg = "yellow", bold = true }
after = { fg = "yellow" }
after.added = { fg = "green", bold = true }
after.error = { fg = "bright_red", bold = true }

[jobs]
done = { fg = "bright_green", bold = true }
failed = { fg = "bright_red", bold = true }
row = { fg = "white" }
running = { fg = "bright_cyan", bold = true }

progress.fill = { fg = "black", bg = "bright_green" }
progress.label.on_fill = { fg = "black", bold = true }
progress.label.on_track = { fg = "bright_white", bold = true }
progress.track = { fg = "bright_black", bg = "black" }

icons.completed = { fg = "bright_green", bold = true }
icons.error = { fg = "bright_red", bold = true }
icons.input_required = { fg = "cyan", bold = true }
icons.ongoing = { fg = "bright_green", bold = true }
icons.paused = { fg = "yellow", bold = true }
icons.queued = { fg = "yellow", bold = true }
icons.scanning = { fg = "bright_cyan", bold = true }
icons.stopped = { fg = "bright_red", bold = true }

[symbols]
working = "\uf017"
path_picker = "\uf0ca"
git = "\uf1d3"
stash = "\uef0d"
# U+F06D1 (nf-md-eye_off_outline); use 8-digit escape — \uf06d1 is U+F06D + "1"
hidden_dotfiles = "\U000F06D1"

[symbols.jobs.list]
scanning = "\uf110"
queued = "\u23F3"
running = "\uf144"
paused = "\uf28b"
canceled = "\uf52f"
failed = "\uf06a"
decision = "\uf059"
completed = "\uf05d"

[symbols.filelist]
selection_subtree = "○"
new = "\uea7f"

[symbols.folders]
folder = "\U000F024B"
open = "\U000F0770"
scanning = "\U000F0D0B"
mount = "\U000F0256"
excluded = "\uf114"

[symbols.scrollbar]
thumb = "┃"

[symbols.meta]
running = "\uf141"

[symbols.menu.progress]
done = "─"
remaining = "-"

[symbols.menu.job]
scanning = "◌"
queued = "○"
running = "◎"
paused = "●"
canceled = "●"
failed = "●"
decision = "●"
completed = "●"
