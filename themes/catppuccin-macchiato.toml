name = "catppuccin-macchiato"
# Generated by import_alacritty.py. Everything not listed here (styles, icons) is inherited from
# the built-in default theme.

[palette]
black = "#494d64"
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
magenta = "#f5bde6"
cyan = "#8bd5ca"
white = "#b8c0e0"
bright_black = "#5b6078"
bright_red = "#ed8796"
bright_green = "#a6da95"
bright_yellow = "#eed49f"
bright_blue = "#8aadf4"
bright_magenta = "#f5bde6"
bright_cyan = "#8bd5ca"
bright_white = "#a5adcb"

[roles]
bg = "#24273a"
surface = "#494d64"
header_bg = "#8aadf4"
inactive_header_bg = "#494d64"
menu_bg = "#181926"
leader_bg = "#181926"
focus_bg = "#5b6078"
button_bg = "#24273a"
button_focus_bg = "#5b6078"
file_cursor_bg = "#6e738d"
file_cursor_dim = "#363a4f"
highlight_bg = "#b7bdf8"
usage_cursor_bg = "#8b90bf"
range_bg = "#2d3045"
range_unselect_bg = "#181926"
inverse_bg = "white"
fg = "#cad3f5"
fg_strong = "#cad3f5"
muted = "#a5adcb"
faint = "#6e738d"
info_columns = "#5b6078"
git_unchanged = "#5b6078"
ink = "#181926"
focus_fg = "#cad3f5"
file_cursor_fg = "#181926"
accent = "#c6a0f6"
accent_alt = "#f4dbd6"
dialog_title = "#b7bdf8"
primary = "blue"
inactive_frame = "#5b6078"
directory = "blue"
symlink = "bright_cyan"
selected = "yellow"
info = "cyan"
success = "green"
success_strong = "bright_green"
warning = "yellow"
attention = "bright_yellow"
danger = "red"
error = "bright_red"
special = "magenta"

[menu]
dropdown.base = { fg = "fg", bg = "menu_bg" }
dropdown.accent = { fg = "accent"}
dropdown.disabled = { fg = "info_columns" }  # surface2: greyed-out pulldown items sit well below the labels, as in the leader menu  # tuned

[message]
error = { fg = "ink", bg = "danger", bold = true }

[panel.row]
info = { fg = "info_columns" }  # keep the dark columns: repair would brighten them  # tuned

[panel.git]
not_modified = { fg = "git_unchanged", bold = true }  # keep the dim mark: repair would brighten it  # tuned

[panel.usage]
normal = { fg = "fg", bg = "file_cursor_dim", icon.file = "faint", icon.folder_open = "faint", icon.folder_mount = "faint", icon.folder_excluded = "faint", icon.fileindex = "faint", icon.git = "faint", icon.suffix = "faint" }  # tuned
selected = { fg = "selected", bg = "file_cursor_dim", icon.file = "faint", icon.folder_open = "faint", icon.folder_mount = "faint", icon.folder_excluded = "faint", icon.fileindex = "faint", icon.git = "faint", icon.suffix = "faint" }  # tuned

[panel.dedup]
row.cursor.all_marked = { fg = "ink", bg = "file_cursor_bg", bold = true }
row.cursor.keep = { fg = "ink", bg = "file_cursor_bg", bold = true }

[panel.active]
header.base = { fg = "ink", bg = "header_bg", bold = true }
row.cursor.selected = { fg = "selected", bg = "file_cursor_bg", bold = true, icon = "file_cursor_fg" }  # keep yellow marked files on the cursor row: repair would swap it for ink  # tuned
title = { fg = "special", bold = true }  # pink (magenta): the active panel title (path, Queue, Details, Operations) stands out  # tuned
usage.cursor.base = { fg = "ink", bg = "usage_cursor_bg" }  # tuned
usage.cursor.selected = { fg = "ink", bg = "usage_cursor_bg", bold = true }  # tuned

[panel.inactive]
frame = { fg = "inactive_frame" }  # keep the dim frame: repair would brighten it  # tuned
usage.cursor.selected = { fg = "ink", bg = "highlight_bg", bold = true }

[panel.tab]
active.base = { fg = "fg", bg = "file_cursor_dim", bold = true }  # surface0: the active tab  # tuned
active.number = { fg = "accent", bold = true }  # mauve slot digit  # tuned
inactive.base = { fg = "muted", bg = "menu_bg" }  # crust: the other tabs, darker than the panel  # tuned
inactive.number = { fg = "accent", bold = true }  # mauve slot digit  # tuned
blocked = { fg = "faint", bg = "menu_bg" }  # every tab while a dialog or menu has focus, crust like the inactive tabs  # tuned

[panel.blocked]
disk_usage_overview = { fg = "faint" }  # tuned
frame = { fg = "faint" }  # tuned
header.base = { fg = "faint", bold = true }  # tuned
header.carousel = { fg = "faint", bg = "bg", bold = true }  # tuned
row.directory = { fg = "faint", bold = true }  # tuned
row.file = { fg = "faint" }  # tuned
row.symlink = { fg = "faint" }  # tuned
surface = { fg = "faint" }  # tuned
text = { fg = "faint" }  # tuned
title = { fg = "faint" }  # tuned

[dialog]
title = { fg = "dialog_title", bold = true }  # lavender: dialog titles on the top border  # tuned

[dialog.button]
active_destructive.base = { fg = "ink", bg = "danger" }
active_destructive.accent = { fg = "ink", bold = true }
active_destructive.accent_alt = { fg = "accent_alt", bold = true }  # tuned

[dialog.option]
invalid = { fg = "fg" }

[leader_menu]
arrow = { fg = "info_columns" }  # surface2: chord hints and arrows sit well below the labels  # tuned
disabled = { fg = "info_columns" }  # surface2: unavailable entries sit well below the labels  # tuned

[dialog.help]
key     = { fg = "fg", bold = true }

[tooltip]
info = { fg = "accent_alt" }  # rosewater info icon  # tuned

[dialog.massrename]
before.removed = { fg = "fg", bold = true }
