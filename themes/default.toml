thumb = "┃"
match = "◇"                  # rail rows holding a preview search match

[icons.tree]
expand = "▶"
collapse = "▼"
continue = "│"
branch = "├─"
end = "└─"
leaf = "·"

[icons.meta]
running = "…"

[icons.menu.progress]
done = "■"
remaining = "■"

[icons.menu.speed]
left = ""   # powerline left half-circle
right = ""  # powerline right half-circle

[icons.menu.status]
separator = "·"  # between and after status-command segments

[icons.menu.job]
scanning = "\U000f02ca"
canceling = "\uf52f"  # same glyph as canceled; status.canceling keeps it yellow
completed = ""
failed = ""
decision = ""
paused = ""
running = ""
queued = ""

[icons.selected]
multi_location = "\uef81"

[icons.leader_menu]
arrow = "\uea9c"

[icons.search]
icon = "\uf002"

[icons.commands]
# U+F1183 (nf-md-console_line); use 8-digit escape
command = "\U000F1183"

[icons.compare]
equal = "="
relocated = "\u2194"
primary_only = "<"
secondary_only = ">"
content_diff = "\u2260"
pending = "\U000f02ca"
error = "!"
name_left = "\u2192"    # relocated row whose merge takes the left path (compare.relocated-name)
name_right = "\u2190"   # relocated row whose merge takes the right path
