bright_cyan = "#94e2d5"
bright_white = "#a6adc8"

[roles]
bg = "#1e1e2e"
surface = "#313244"
header_bg = "#89b4fa"
inactive_header_bg = "#585b70"
menu_bg = "#11111b"
leader_bg = "#11111b"
focus_bg = "#45475a"
button_bg = "#1e1e2e"
button_focus_bg = "#45475a"
file_cursor_bg = "#9399b2"
file_cursor_dim = "#313244"
highlight_bg = "#b4befe"
range_bg = "#6c7086"
range_unselect_bg = "#eba0ac"
inverse_bg = "white"
fg = "#cdd6f4"
fg_strong = "#cdd6f4"
muted = "#9399b2"
faint = "#6c7086"
info_columns = "#585b70"
ink = "#11111b"
focus_fg = "#cdd6f4"
file_cursor_fg = "#11111b"
accent = "#cba6f7"
accent_alt = "#f5e0dc"
primary = "blue"
inactive_frame = "#585b70"
directory = "blue"
symlink = "bright_cyan"
selected = "yellow"
info = "cyan"
success = "green"
success_strong = "bright_green"
warning = "yellow"
attention = "bright_yellow"
danger = "red"
error = "bright_red"
special = "magenta"

[menu]
dropdown = { fg = "fg", bg = "menu_bg" }
dropdown.accent = { fg = "accent"}

[message]
error = { fg = "ink", bg = "danger", bold = true }

[panel.row]
info = { fg = "info_columns" }  # keep the dark columns: repair would brighten them  # tuned

[panel.dedup]
row.cursor.all_marked = { fg = "ink", bg = "file_cursor_bg", bold = true }
row.cursor.keep = { fg = "ink", bg = "file_cursor_bg", bold = true }

[panel.active]
header = { fg = "ink", bg = "header_bg", bold = true }
row.cursor.selected = { fg = "ink", bg = "file_cursor_bg", bold = true, icon = "file_cursor_fg" }
usage.cursor = { fg = "ink", bg = "highlight_bg" }  # tuned
usage.cursor.selected = { fg = "ink", bg = "highlight_bg", bold = true }

[panel.inactive]
frame = { fg = "inactive_frame" }  # keep the dim frame: repair would brighten it  # tuned
usage.cursor.selected = { fg = "ink", bg = "highlight_bg", bold = true }

[panel.blocked]
disk_usage_overview = { fg = "faint" }  # tuned
frame = { fg = "faint" }  # tuned
header = { fg = "faint", bold = true }  # tuned
header.carousel = { fg = "faint", bg = "bg", bold = true }  # tuned
row.directory = { fg = "faint", bold = true }  # tuned
row.file = { fg = "faint" }  # tuned
row.symlink = { fg = "faint" }  # tuned
surface = { fg = "faint" }  # tuned
text = { fg = "faint" }  # tuned
title = { fg = "faint" }  # tuned

[dialog.button]
active_destructive = { fg = "ink", bg = "danger" }
active_destructive.accent = { fg = "ink", bold = true }
active_destructive.accent_alt = { fg = "accent_alt", bold = true }  # tuned

[tooltip]
info = { fg = "ink" }       # foreground of the info icon ([icons.dialog] info) on the box
