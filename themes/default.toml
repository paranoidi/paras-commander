changed = "\U000F0B86"    # nf-md-database_edit: size or mtime differs from the index
new = "\U000F01BB"        # nf-md-database_minus: on disk, not in the index
missing = "\U000F01BA"    # nf-md-database_plus: in the index only (ghost row)
excluded = "\U000F1640"   # nf-md-database_off: not indexed, skipped by the scan rules
