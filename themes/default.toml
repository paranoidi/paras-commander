name = "default"

# [palette] values may be hex "#RRGGBB", integers 0–255 (ANSI/xterm index), or "default" for
# the emulator’s configured default foreground/background (separate from ANSI black/white).
# Style fg/bg/icon values are strings: a [palette] name, hex "#RRGGBB", or "default"; add a
# palette entry to use another xterm index.
[palette]
black = 0
red = 1
green = 2
yellow = 3
blue = 4
magenta = 5
cyan = 6
white = 7
bright_black = 8
bright_red = 9
bright_green = 10
bright_yellow = 11
bright_blue = 12
bright_magenta = 13
bright_cyan = 14
bright_white = 15

[status]                     # job and work states: menu-bar job strip, Jobs view, Commands view, file-list marks
scanning = { fg = "bright_magenta", bold = true }   # also disk usage, fileindex scans, spinners
queued = { fg = "bright_blue", bold = true }
running = { fg = "bright_green", bold = true }
paused = { fg = "yellow", bold = true }
decision = { fg = "cyan", bold = true }
failed = { fg = "bright_red", bold = true }
canceled = { fg = "red", bold = true }
completed = { fg = "green", bold = true }

[menu]                       # misc menu chrome
detail = { fg = "white" }
status = { fg = "cyan" }     # status-command text at top-left of menu bar (status.toml)
status.separator = { fg = "bright_black" }  # glyph between and after status-command segments
# dropdown is both a leaf style and a parent of .accent/.frame/.selected — keep dotted here
dropdown = { fg = "black", bg = "blue" }
dropdown.accent = { fg = "white"}
dropdown.frame = { fg = "bright_blue", bg = "blue" }
dropdown.selected = { fg = "black", bg = "bright_blue", bold = true }

[menu.bar]                   # top menu bar
active = { fg = "default" }
inactive = { fg = "bright_black" }
accent = { fg = "magenta", bold = true }
alert = { fg = "bright_red", bold = true }
selected = { fg = "black", bg = "cyan", bold = true }

[menu.progress]              # menu-bar aggregate progress
done = { fg = "green" }
done.gfx.0 = { fg = "white" }          # light bar head (optional, gfx.0..gfx.9)
done.gfx.1 = { fg = "bright_green" }   # light bar trail
delete.gfx.0 = { fg = "bright_red" }   # delete light bar head (optional, gfx.0..gfx.9)
delete.gfx.1 = { fg = "red" }
delete.gfx.2 = { fg = "bright_yellow" }
delete.gfx.3 = { fg = "yellow" }
remove.gfx.0 = { fg = "red" }          # light bar head while a move removes copied sources (optional, gfx.0..gfx.9)
remove.gfx.1 = { fg = "yellow" }
remaining = { fg = "black" }

[menu.speed]                 # menu-bar transfer speed pill left of the progress bar
cap = { fg = "bright_black" }
text = { fg = "default", bg = "bright_black" }

[message]
info = { fg = "black", bg = "white" }
warn = { fg = "black", bg = "yellow", bold = true }
error = { fg = "bright_white", bg = "red", bold = true }
success = { fg = "black", bg = "green" }
sweep = { fg = "black", bg = "bright_white" } # leading edge of a toast sweeping in

[footer]
key = { fg = "magenta", bold = true }
label = { fg = "default" }
label.shift = { fg = "bright_black" }
hover = { fg = "black", bg = "cyan" }  # entry under the mouse pointer
hover.active = { fg = "bright_white", bg = "cyan" }  # its part a click presses (key + hint, or the shift word)

[panel]                      # panel-wide text
