# Global shortcuts under [main]. Each value is a list of
# chord strings (single-stroke). See docs/keybindings.md for syntax.
#
# View overlays ([jobs], [commands], [messages], [file_preview], [compare]) take precedence over
# [main] while that view is focused.
#
# Dialog overlays ([dialog.input], [dialog.rename], …) apply only while
# the matching dialog context is focused.
#
# Fuzzy path picker on copy/move destination or symlink/hardlink path rows
# uses the same chords as bookmark.open under [main].
#
# [dialog.input] — ui.input.* only (e.g. restore default placeholder).
# [dialog.rename] — file.rename.open-sanitize, file.rename.open-slugify, and file.rename.open-encoding.
# [dialog.bookmark] — bookmark.delete (fzf-marks only).
# [dialog.find] — find.select-all, find.unselect-all, find.select-group, find.unselect-group.
# [dialog.history] — panel.history-both-panels.
# [dialog.flatten] — flatten.destination-active and flatten.destination-inactive.

[main]
  "app.drop-to-shell" = ["C-o"]
  "app.open-menu" = ["F9"]
  "app.quit" = ["F10"]
  "app.quit-immediate" = ["S-F10"]
  "app.show-help" = ["F1"]
  "app.user-menu" = ["F2"]
  "app.user-menu-edit" = ["S-F2"]
  "bookmark.add" = ["C-b"]
  "bookmark.open" = ["C-g", "C-e"]
  "commands.open" = ["M-c"]
  "file.copy" = ["F5"]
  "file.copy-here" = ["S-F5"]
  "file.delete" = ["F8", "delete"]
  "file.edit" = ["F4"]
  "file.flatten" = ["C-M-f"]
  "file.mkdir" = ["F7"]
  "file.mkdir-open-in-other" = ["S-F7"]
  "file.move" = ["F6"]
  "file.quick-view" = ["S-F3"]
  "file.rename" = ["S-F6"]
  "file.view" = ["F3"]
  "jobs.answer-blocker" = ["C-q", "M-q"]
  "file.quick-view.preview-page-down" = ["C-j"]
  "file.quick-view.preview-page-up" = ["C-k"]
  "file.view.diff-next-hunk" = ["C-M-j"]
  "file.view.diff-prev-hunk" = ["C-M-k"]
  "jobs.open" = ["M-j"]
  "messages.open" = ["M-m"]
  "nav.backward" = ["M-C-right"]
  "nav.bottom" = ["end"]
  "nav.down" = ["down"]
  "nav.forward" = ["M-C-left"]
  "nav.home" = ["~", "§"]
  "nav.open" = ["enter", "right"]
  "nav.page-down" = ["pgdn"]
  "nav.page-up" = ["pgup"]
  "nav.parent" = ["left", "backspace"]
  "nav.top" = ["home"]
  "nav.up" = ["up"]
  "panel.clear-selection" = ["C-u"]
  "panel.compare-panels" = ["C-M-c"]
  "panel.cycle-listing-format" = ["M-t"]
  "panel.disk-usage-abort-all" = ["C-M-d"]
  "panel.disk-usage-clear" = ["M-d"]
  "panel.disk-usage-scan" = ["C-d"]
  "panel.external-browser" = ["M-e"]
  "panel.find-dialog" = ["C-f"]
  "panel.focus-selections" = ["C-M-s"]
  "panel.history-dialog" = ["M-h", "C-h"]
  "panel.invert-selection" = ["*"]
  "panel.meta" = ["M-,"]
  "panel.meta-edit" = ["S-M-,", "M-;"]
  "panel.open-active-path-in-other" = ["M-i", "S-left"]
  "panel.open-dir-in-other" = ["M-o", "S-right"]
  "panel.refresh" = ["M-C-r"]
  "panel.select-group" = ["+"]
  "panel.select-toggle" = ["insert"]
  "panel.sort-dialog" = ["C-s"]
  "panel.stash-toggle" = ["M-insert"]
  "panel.switch" = ["tab"]
  "panel.toggle-carousel" = ["C-c"]
  "panel.toggle-hidden" = ["M-."]
  "panel.toggle-hide-inactive" = ["S-tab"]
  "panel.toggle-sync" = ["C-M-o"]
  "panel.toggle-zoom-active-panel" = ["M-z"]
  "panel.toggle-split-orientation" = ["C-space"]
  "panel.unselect-group" = ["-"]
  "remote.sftp-link" = ["C-r"]

[jobs]
  "jobs.cancel" = ["C-c"]
  "jobs.terminate" = ["F8"]
  "jobs.kill" = ["S-F8"]
  "jobs.close" = ["left"]
  "jobs.pause" = ["C-p"]
  "jobs.queue-down" = ["C-down"]
  "jobs.queue-up" = ["C-up"]
  "jobs.resume" = ["C-r"]

[commands]
  "commands.close" = ["left"]

[compare]
  "compare.close" = ["esc"]
  "compare.cycle-filter" = ["F3"]
  "compare.reset-filter" = ["S-F3"]
  "compare.refresh" = ["M-r"]
  "compare.merge" = ["F5"]

[messages]
  "messages.clear" = ["F8"]
  "messages.close" = ["left"]

[file_preview]
  "file.view.theme-picker" = ["F9"]
  "file.view.diff-next-hunk" = ["C-M-j"]
  "file.view.diff-prev-hunk" = ["C-M-k"]

[dialog]
  [dialog.input]
    "ui.input.backward-word" = ["M-b"]
    "ui.input.forward-word" = ["M-f"]
    "ui.input.kill-word-backward" = ["C-w"]
    "ui.input.restore-default" = ["C-r", "C-d"]
  [dialog.rename]
    "file.rename.open-sanitize" = ["F2"]
    "file.rename.open-slugify" = ["F3"]
    "file.rename.open-encoding" = ["F4"]
  [dialog.mkdir]
    "file.mkdir.extract-common-name" = ["F7"]
  [dialog.bookmark]
    "bookmark.delete" = ["F8"]
  [dialog.find]
    "find.select-all" = ["F5", "C-a"]
    "find.select-group" = ["F6"]
    "find.unselect-all" = ["F4"]
    "find.unselect-group" = ["F7"]
  [dialog.history]
    "panel.history-both-panels" = ["F5"]
  [dialog.flatten]
    "flatten.destination-active" = ["F5"]
    "flatten.destination-inactive" = ["F6"]
