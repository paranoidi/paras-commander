theme = "default"
show_hidden = false
respect_gitignore = true
confirm_delete = true
confirm_overwrite = true
case_insensitive_filter = true
job_concurrency = 1
startup_path_mode = "cwd"
default_sort = "name"
default_listing_format = "mtime"
sort_reverse = false
directories_first = true
disk_usage_idle_size_sort = true
disk_usage_idle_sort_delay_ms = 500
refresh_interval_ms = 2500
disk_usage_descend_into_mount_points = false
disk_usage_walk_concurrency = 4
follow_symlinks_on_navigation = true
open_files_externally = true
run_executables_on_enter = true
delete_mode = "permanent"

[ui]
  show_menu_bar = true
  show_footer = true
  show_status_line = true
  show_jobs_line = true
  show_file_icons = true
  border_style = "single"
  clock = false
  selections_panel_max_rows = 0
  status_message_ttl_seconds = 4.5
  path_picker_validate_delay_ms = 200
  key_repeat_debounce_ms = 80
  find_query_debounce_ms = 150
  find_max_results = 200
  find_list_nav_idle_ms = 400
  zoom_active_panel = true
  zoom_active_panel_disabled_above_width = 155
  panel_zoom_active_percent = 70
  panel_zoom_inactive_percent = 30
  shrunken_shows_name_only = true
  scroll_mode = "edge"
  scroll_edge_margin = 5
  panel_scrollbar = "thumb"
  panel_scrollbar_inactive = false
  message_log_max_entries = 500
  screen_render_hash_cache = true

[filter]
  mode = "fuzzy"
  syntax = "subset-fzf"
  match_path_segments = false
  cycle_matches = "visual"

[jobs]
  show_finished = true
  keep_finished = 20
  autoshow_on_error = true
  autoshow_on_start = false
  progress_ui_wake_debounce_ms = 150
  worker_progress_min_bytes = 524288
  worker_progress_min_interval_ms = 200
  throughput_chart_window_sec = 45
  throughput_chart_column_ms = 400
  throughput_chart_enabled = true
  free_space_on_progress_wake = true
  free_space_poll_interval_secs = 5
  scan_yield_interval_ms = 50
  scan_yield_every_n = 64
  scan_nice_increment = 10
  scan_progress_min_interval_ms = 200

[operations]
  preserve_permissions = true
  preserve_timestamps = true
  copy_buffer_kib = 256
  sync_after_each_file = true
  disk_space_check_min_file_bytes = 52428800
  cow_file_cloning = true
  copy_file_range = true
  sparse_file_copy = false
  preallocate_destination = false
  preallocate_min_file_bytes = 1048576
  sync_at_job_end = false
  sync_min_file_kib = 0
  flatten_recursive = false
  flatten_remove_empty_dirs = true
  rename_focus_after = false

[logging]
  enabled = false
  level = "info"
  path = ""

[bookmarks]
  file = ""

[user_menu]
  file = ""
  local_names = ["menu.toml"]

[preview]
  mode = "internal"
  style = "catppuccin-frappe"
  line_numbers = true
  command = "bat -n --paging=never --color=always --wrap=auto --terminal-width=%w %f"

[sftp]
  known_hosts_file = ""
  ssh_config_file = ""
  idle_timeout_secs = 60
  dial_timeout_secs = 30
  list_timeout_secs = 60

[meta]
  file = ""
  local_names = ["meta.toml"]
  workers = 4

[pools]
  file = ""

[dedup]
  # Pause before hashing when total candidate bytes exceed this (0 disables).
  hash_confirm_bytes = 34359738368
