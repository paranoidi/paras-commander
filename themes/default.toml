[panel.usage]                 # disk usage bar colors; icon.<group> recolors that icon group where the bar is behind it
# Groups: folder folder_expanded folder_scanning folder_open folder_mount folder_excluded (folder icons),
# file, preview_loading (icon strip), fileindex, git (status cells), suffix (name column marks).
# An unlisted group keeps the icon's own color on the bar. Cursor row bars take the same table on
# panel.active.usage.cursor, .cursor.selected and panel.inactive.usage.cursor, .cursor.selected.
normal = { fg = "fg", bg = "surface", icon.file = "faint", icon.folder_open = "faint", icon.folder_mount = "faint", icon.folder_excluded = "faint", icon.fileindex = "faint", icon.git = "faint", icon.suffix = "faint" }
selected = { fg = "selected", bg = "surface", icon.file = "faint", icon.folder_open = "faint", icon.folder_mount = "faint", icon.folder_excluded = "faint", icon.fileindex = "faint", icon.git = "faint", icon.suffix = "faint" }

