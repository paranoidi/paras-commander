name = "default"

# Values may be hex "#RRGGBB", integers 0–255 (ANSI/xterm index), or "default" for the
# emulator’s configured default foreground/background (separate from ANSI black/white).
[palette]
black = 0
red = 1
green = 2
yellow = 3
blue = 4
magenta = 5
cyan = 6
white = 7
bright_black = 8
bright_red = 9
bright_green = 10
bright_yellow = 11
bright_blue = 12
bright_magenta = 13
bright_cyan = 14
bright_white = 15

[styles]
menu.bar = { fg = "default", bg = "default" }
menu.bar.accent = { fg = "magenta", bold = true }
menu.bar.alert = { fg = "bright_red", bold = true }
menu.bar.selected = { fg = "black", bg = "cyan", bold = true }
menu.dropdown = { fg = "black", bg = "blue" }
menu.dropdown.frame = { fg = "bright_blue", bg = "blue" }
menu.dropdown.accent = { fg = "white", bold = false }
menu.dropdown.selected = { fg = "black", bg = "bright_blue", bold = true }
menu.detail = { fg = "white", bg = "default" }

status.info = { fg = "white", bg = "default" }
status.warn = { fg = "yellow", bg = "default", bold = true }
status.error = { fg = "bright_red", bg = "default", bold = true }
status.waiting_input = { fg = "bright_red", bg = "default", bold = true }

footer.key = { fg = "magenta", bg = "default", bold = true }
footer.label = { fg = "default", bg = "default" }

panel.frame = { fg = "bright_black", bg = "default" }
panel.surface = { fg = "white", bg = "default" }
panel.title.active = { fg = "white", bg = "default", bold = true }
panel.title.inactive = { fg = "white", bg = "default" }
panel.title.volume_free = { fg = "bright_black", bg = "default", bold = false }
panel.header = { fg = "bright_white", bg = "blue", bold = true }
panel.spinner = { fg = "bright_magenta", bg = "default", bold = true }

panel.row.normal = { fg = "white", bg = "default" }
panel.row.directory = { fg = "blue", bg = "default", bold = true }
panel.row.symlink = { fg = "bright_cyan", bg = "default" }
panel.row.selected = { fg = "yellow", bg = "default", bold = true }
panel.row.cursor.active = { fg = "black", bg = "cyan", icon = "black" }
panel.row.cursor.inactive = { fg = "white", bg = "black" }
panel.row.cursor.selected = { fg = "yellow", bg = "cyan", bold = true, icon = "black" }
panel.sync.indicator = { fg = "green", bg = "default", bold = true }

panel.blocked.frame = { fg = "bright_black", bg = "default" }
panel.blocked.surface = { fg = "bright_black", bg = "default" }
panel.blocked.title = { fg = "bright_black", bg = "default" }
panel.blocked.header = { fg = "bright_black", bg = "default", bold = true }
panel.blocked.row.normal = { fg = "bright_black", bg = "default" }
panel.blocked.row.directory = { fg = "bright_black", bg = "default", bold = true }
panel.blocked.row.symlink = { fg = "cyan", bg = "default" }
panel.blocked.row.selected = { fg = "bright_yellow", bg = "bright_black", bold = true }
panel.blocked.row.cursor = { fg = "white", bg = "black" }
panel.blocked.row.cursor.selected = { fg = "bright_yellow", bg = "bright_black", bold = true }

panel.folder.diskscan = { fg = "bright_magenta", bg = "default" }
panel.folder.diskscan_excluded = { fg = "black", bg = "default" }

panel.usage.prefix.normal = { fg = "white", bg = "bright_black" }
panel.usage.prefix.selected = { fg = "yellow", bg = "bright_black" }
panel.usage.prefix.cursor.active = { fg = "black", bg = "bright_cyan" }
panel.usage.prefix.cursor.inactive = { fg = "white", bg = "black" }
panel.usage.prefix.cursor.selected = { fg = "yellow", bg = "bright_blue", bold = true }

fuzzy.input = { fg = "bright_yellow", bg = "default", bold = true }
fuzzy.input.nomatch = { fg = "bright_red", bg = "default", bold = true }
fuzzy.highlight = { fg = "magenta", bold = true }
fuzzy.highlight.cursor = { fg = "red", bold = true }

dialog.frame = { fg = "white" }
dialog.title = { bold = true }
dialog.text = { fg = "white" }
dialog.surface = { fg = "white", bg = "bright_black" }
# bg matters for the path-picker trailing glyph when that control is focused; shortcut letters use fg+bold only.
dialog.accent = { fg = "white", bg = "black", bold = true }
dialog.input.active = { fg = "bright_white", bg = "default", bold = true }
dialog.input.active.placeholder = { fg = "default", bg = "default" }
dialog.input.active.error = { fg = "red", bg = "default" }
dialog.input.inactive = { fg = "white", bg = "black" }
dialog.input.inactive.placeholder = { fg = "white", bg = "black" }
dialog.input.inactive.error = { fg = "red", bg = "black" }
dialog.button.normal = { fg = "white", bg = "black" }
dialog.button.active = { fg = "black", bg = "cyan" }
dialog.option.inactive = { fg = "white", bg = "bright_black" }
dialog.option.active = { fg = "yellow", bg = "bright_black", bold = true }
dialog.option.selected = { fg = "yellow", bg = "bright_black" }

jobs.row = { fg = "white" }
jobs.running = { fg = "bright_cyan", bold = true }
jobs.done = { fg = "bright_green", bold = true }
jobs.failed = { fg = "bright_red", bold = true }

jobs.progress.track = { fg = "bright_black", bg = "black" }
jobs.progress.fill = { fg = "black", bg = "bright_green" }
jobs.progress.label.on_fill = { fg = "black", bold = true }
jobs.progress.label.on_track = { fg = "bright_white", bold = true }

jobs.icons.queued = { fg = "yellow", bold = true }
jobs.icons.ongoing = { fg = "bright_green", bold = true }
jobs.icons.paused = { fg = "yellow", bold = true }
jobs.icons.stopped = { fg = "bright_red", bold = true }
jobs.icons.error = { fg = "bright_red", bold = true }
jobs.icons.input_required = { fg = "cyan", bold = true }
jobs.icons.completed = { fg = "bright_green", bold = true }

[symbols]
queued = "\uf1af"
running = "\uf144"
paused = "\uf28b"
canceled = "\uf28d"
failed = "\uf06a"
decision = "\uf059"
completed = "\uf05d"
path_picker = "\uf0ca"
