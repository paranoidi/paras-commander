name = "default"

# A theme has two colour layers.
#
# [palette] holds only raw colours: exactly the 16 ANSI slot names below. A value is an ANSI/xterm
# index 0-255, "#RRGGBB", or "default" (the emulator's own default foreground/background, separate
# from ANSI black/white). A slot left out keeps the ANSI index of its name.
#
# [roles] holds intents: a [palette] name, "#RRGGBB" or "default". Every style fg/bg/icon below
# names a role, never a hue or a hex value, so a theme recolours the whole UI by editing [palette]
# and [roles] only. A role left out takes its built-in default palette name (the ones listed here).
[palette]
black = 0
red = 1
green = 2
yellow = 3
blue = 4
magenta = 5
cyan = 6
white = 7
bright_black = 8
bright_red = 9
bright_green = 10
bright_yellow = 11
bright_blue = 12
bright_magenta = 13
bright_cyan = 14
bright_white = 15

[roles]
# Backgrounds
bg = "default"                # base background of every cell without its own; also input and list backgrounds, progress tracks
surface = "bright_black"      # dialog fill, chips, bar tracks, carousel header, speed pill
header_bg = "blue"            # panel headers
inactive_header_bg = "bright_black"  # header of the inactive panel
menu_bg = "blue"              # menu dropdown fill and frame
leader_bg = "black"           # leader (Esc) menu fill, apart from the panels behind it
focus_bg = "cyan"             # the focused item: open menu-bar title, selected pulldown entry, selected completion entry, hovered footer entry
button_bg = "black"           # face of an unfocused dialog button
button_focus_bg = "cyan"      # face of the focused dialog button
file_cursor_bg = "cyan"       # cursor row of an active file list (panels, duplicate finder)
file_cursor_dim = "black"     # cursor row of an inactive, carousel-inactive or blocked panel
highlight_bg = "bright_blue"  # clickable part of the hovered footer entry, disk usage cursor on a selected row, mount mark
range_bg = "bright_black"     # rows covered by a pending range select
range_unselect_bg = "red"     # rows covered by a mouse-drag unselect
inverse_bg = "white"          # light boxes: tooltips, info toast, toast sweep edge
# Text
fg = "white"                  # body text
fg_strong = "bright_white"    # emphasised text: headers, hints, active input, progress labels
muted = "bright_black"        # dimmed text: blocked frames, placeholders
faint = "black"               # barely visible text on bg/surface: disabled options, remaining progress
info_columns = "bright_black"  # file-list info columns: size, mtime, permissions, meta
ink = "black"                 # dark text on a coloured fill
focus_fg = "black"            # text on focus_bg
file_cursor_fg = "black"      # text and icon on file_cursor_bg
# Structure
accent = "magenta"            # shortcut letters, key hints, match highlights
accent_alt = "magenta"        # dialog shortcut letters that need Alt
primary = "blue"              # active panel frame, info icon, git modified, tagged
inactive_frame = "bright_black"  # inactive panel frame
directory = "blue"            # directory names in listings
symlink = "bright_cyan"       # symlinks, open-folder mark, disk usage cursor
selected = "yellow"           # selected files, selection sizes, active/selected dialog options
# States
info = "cyan"                 # informational: decision, status text, group titles, other-panel marks
success = "green"             # completed, synced, new git file, job mark
success_strong = "bright_green"  # running, hashing, equal, new file mark, keep marks
warning = "yellow"            # paused, warn toast, differs, renamed, skipped
attention = "bright_yellow"   # canceling, parked find, entry filter, fuzzy input
danger = "red"                # deleted, conflicted, broken link, destructive actions, invalid input
error = "bright_red"          # failed, alerts, missing, no fuzzy match
special = "magenta"           # queued, scanning, pinned, typechange, preview cold

[status]                     # job and work states: menu-bar job strip, Jobs view, Commands view, file-list marks
scanning = { fg = "special", bold = true }   # also disk usage, fileindex scans, spinners
queued = { fg = "special", bold = true }
running = { fg = "success_strong", bold = true }
paused = { fg = "warning", bold = true }
decision = { fg = "info", bold = true }
failed = { fg = "error", bold = true }
canceling = { fg = "attention", bold = true }
canceled = { fg = "danger", bold = true }
completed = { fg = "success", bold = true }

[menu]                       # misc menu chrome
detail = { fg = "fg" }
status = { fg = "info" }     # status-command text at top-left of menu bar (status.toml)
status.separator = { fg = "muted" }  # glyph between and after status-command segments
# dropdown is both a leaf style and a parent of .accent/.frame/.selected — keep dotted here
dropdown = { fg = "ink", bg = "menu_bg" }
dropdown.accent = { fg = "fg"}
dropdown.frame = { fg = "highlight_bg", bg = "menu_bg" }
dropdown.selected = { fg = "focus_fg", bg = "focus_bg", bold = true }

[menu.bar]                   # top menu bar
active = { fg = "fg" }
inactive = { fg = "muted" }
accent = { fg = "accent", bold = true }
alert = { fg = "error", bold = true }
selected = { fg = "focus_fg", bg = "focus_bg", bold = true }

[menu.progress]              # menu-bar aggregate progress
done = { fg = "success" }
done.gfx.0 = { fg = "fg" }          # light bar head (optional, gfx.0..gfx.9)
done.gfx.1 = { fg = "success_strong" }   # light bar trail
delete.gfx.0 = { fg = "error" }   # delete light bar head (optional, gfx.0..gfx.9)
delete.gfx.1 = { fg = "danger" }
delete.gfx.2 = { fg = "attention" }
delete.gfx.3 = { fg = "warning" }
remove.gfx.0 = { fg = "danger" }          # light bar head while a move removes copied sources (optional, gfx.0..gfx.9)
remove.gfx.1 = { fg = "warning" }
remaining = { fg = "faint" }

[menu.speed]                 # menu-bar transfer speed pill left of the progress bar
cap = { fg = "surface" }
text = { fg = "fg", bg = "surface" }

[message]
info = { fg = "ink", bg = "inverse_bg" }
warn = { fg = "ink", bg = "warning", bold = true }
error = { fg = "fg_strong", bg = "danger", bold = true }
success = { fg = "ink", bg = "success" }
sweep = { fg = "ink", bg = "inverse_bg" } # leading edge of a toast sweeping in

[footer]
key = { fg = "accent", bold = true }
label = { fg = "fg" }
label.shift = { fg = "muted" }
hover = { fg = "focus_fg", bg = "focus_bg" }  # entry under the mouse pointer
hover.active = { fg = "ink", bg = "highlight_bg" }  # its part a click presses (key + hint, or the shift word); its own bg keeps it distinct from the rest of the entry

[panel]                      # panel-wide text
text = { fg = "fg" }
hint = { fg = "fg_strong", bold = true }
empty = { fg = "muted" }  # "[empty]" text of empty lists

[panel.row]                  # file-list row colors
cursor.range = { fg = "ink", bg = "selected", icon = "ink" }  # cursor row while a range select is pending
cursor.range.selected = { fg = "ink", bg = "selected", bold = true, icon = "ink" }
range = { bg = "range_bg" }   # other rows a pending range select covers; background only, rows keep their text colors
range.unselect = { bg = "range_unselect_bg" }  # same, for a mouse drag that unselects them
directory = { fg = "directory", bold = true }
file = { fg = "fg" }
info = { fg = "info_columns" }  # size / mtime / permissions / meta columns
selected = { fg = "selected", bold = true }
symlink = { fg = "symlink" }
tree.connector = { fg = "muted" }

[panel.row.mark]             # suffix marks on file rows
selection_subtree = { fg = "selected" }
new = { fg = "success_strong" }
new.previous = { fg = "attention" }
new.older = { fg = "muted" }
renamed = { fg = "info" }
no_permission = { fg = "muted" }
pinned = { fg = "special" }
range_anchor = { fg = "selected" }
other_match = { fg = "muted" }
other_match.cursor = { fg = "info" }
job = { fg = "success" }
job.read = { fg = "warning" }
job.move = { fg = "danger" }
job.delete = { fg = "danger" }
job.removing = { fg = "danger" }   # move source being deleted after its copy (optional)

[panel.icon]                 # file icon colors
